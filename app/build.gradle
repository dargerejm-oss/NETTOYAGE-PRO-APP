plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.jmdargere.nettoyage'
    compileSdk 36

    defaultConfig {
        applicationId "com.jmdargere.nettoyage"
        minSdk 26
        targetSdk 36
        versionCode 5
        versionName "1.4"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    signingConfigs {
        fixe {
            storeFile file("cle_fixe.keystore")
            storePassword "android"
            keyAlias "nettoyage"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fixe
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixe
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version "3.12"
        pip {
            install "flask"
            install "pillow"
        }
    }
}
